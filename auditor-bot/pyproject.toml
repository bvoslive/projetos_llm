[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fiscal-de-bot"
version = "0.1.0"
description = "Auditor de agentes de IA no WhatsApp: LLM-judge calibrado, regras determinísticas, LGPD e red teaming em PT-BR (LangGraph)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Bruno Vos" }]
keywords = ["langgraph", "langchain", "llm-evaluation", "red-teaming", "whatsapp", "lgpd", "pt-br"]
dependencies = [
    "langgraph>=0.6",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.3"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dashboard = ["streamlit>=1.35", "pandas>=2.0"]
pdf = ["weasyprint>=62"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110"]

[project.scripts]
fiscal = "fiscal.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fiscal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Textos em português (prompts, mensagens, docstrings) ficam naturalmente longos.
ignore = ["E501"]
